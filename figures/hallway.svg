<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="560" height="400" fill="#ffffff"/>
  <!-- floor of the hallway -->
  <path d="M40 170 H420 V20 H480 V380 H420 V230 H40 Z" fill="#f1efe9"/>
  <!-- walls -->
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="square">
    <path d="M40 170 H420 V20"/>
    <path d="M40 230 H420 V380"/>
    <path d="M480 20 V380"/>
  </g>
  <!-- sofa: schematic, not the optimal shape -->
  <path d="M110 200 C110 182 118 173 135 173 H160 C175 173 180 188 205 188 C230 188 235 173 250 173 H262 C276 173 284 184 284 200
           C284 216 276 227 262 227 H250 C235 227 230 212 205 212 C180 212 175 227 160 227 H135 C118 227 110 218 110 200 Z"
        fill="#d9774b" stroke="#8a3d1c" stroke-width="2"/>
  <text x="197" y="205" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">sofa</text>
  <!-- width marker -->
  <g stroke="#555" stroke-width="1.5">
    <line x1="60" y1="173" x2="60" y2="227"/>
    <line x1="54" y1="173" x2="66" y2="173"/>
    <line x1="54" y1="227" x2="66" y2="227"/>
  </g>
  <text x="72" y="205" font-size="15" fill="#333">1</text>
  <!-- arrows -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2a6fb0"/>
    </marker>
  </defs>
  <g stroke="#2a6fb0" stroke-width="3" fill="none" marker-end="url(#ah)">
    <path d="M300 200 H390 Q450 200 450 140 V50"/>
    <path d="M390 200 Q450 200 450 260 V350"/>
  </g>
  <text x="500" y="70" font-size="15" fill="#2a6fb0" text-anchor="middle" transform="rotate(90 500 70)">turn left</text>
  <text x="500" y="330" font-size="15" fill="#2a6fb0" text-anchor="middle" transform="rotate(90 500 330)">or turn right</text>
  <text x="40" y="290" font-size="14" fill="#333">Hallway width 1. The same rigid shape, from the</text>
  <text x="40" y="310" font-size="14" fill="#333">same start, must fit around the corner both ways.</text>
  <text x="40" y="330" font-size="14" fill="#333">How large can its area be?</text>
  <text x="40" y="365" font-size="11" fill="#888">(sofa drawn schematically, not the optimal shape)</text>
</svg>
