<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="230" fill="#ffffff"/>
  <!-- scale: x = 60 + (v - 1.6) * 2500 -->
  <rect x="172.5" y="95" width="237.5" height="30" fill="#cfe3c4"/>
  <rect x="410" y="95" width="62.5" height="30" fill="#f3c9c0"/>
  <line x1="60" y1="125" x2="580" y2="125" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1.5">
    <line x1="60" y1="125" x2="60" y2="132"/><line x1="185" y1="125" x2="185" y2="132"/>
    <line x1="310" y1="125" x2="310" y2="132"/><line x1="435" y1="125" x2="435" y2="132"/>
    <line x1="560" y1="125" x2="560" y2="132"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="60" y="148">1.60</text><text x="185" y="148">1.65</text><text x="310" y="148">1.70</text>
    <text x="435" y="148">1.75</text><text x="560" y="148">1.80</text>
  </g>
  <text x="291" y="115" font-size="13" text-anchor="middle" fill="#2f5d1f">the true answer is somewhere here</text>
  <text x="441" y="88" font-size="12" text-anchor="middle" fill="#9a3a26">ruled out</text>
  <text x="441" y="74" font-size="12" text-anchor="middle" fill="#9a3a26">newly</text>
  <!-- markers -->
  <g stroke-width="3">
    <line x1="172.5" y1="85" x2="172.5" y2="165" stroke="#2f5d1f"/>
    <line x1="410" y1="60" x2="410" y2="165" stroke="#1f4e8a"/>
    <line x1="472.5" y1="95" x2="472.5" y2="165" stroke="#999" stroke-dasharray="5 4"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="172.5" y="183" fill="#2f5d1f" font-weight="bold">1.645</text>
    <text x="172.5" y="200" fill="#2f5d1f">best sofa found</text>
    <text x="172.5" y="215" fill="#2f5d1f">(Romik 2018)</text>
    <text x="400" y="183" fill="#1f4e8a" font-weight="bold">1.74</text>
    <text x="400" y="200" fill="#1f4e8a">new proven ceiling</text>
    <text x="520" y="183" fill="#777" font-weight="bold">1.765</text>
    <text x="520" y="200" fill="#777">old ceiling</text>
  </g>
  <text x="60" y="30" font-size="15" fill="#333" font-weight="bold">Largest possible area (hallway width = 1)</text>
</svg>
